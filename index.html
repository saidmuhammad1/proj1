<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proj1 Dashboard & Todo App</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }
        .todo-input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--accent-color);
        }
        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
        ul {
            list-style: none;
        }
        li {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 0.875rem 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        li span {
            word-break: break-all;
        }
        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Proj1 Dashboard</h1>
            <p>Powered by Node.js, Express & Dokku Auto-Deploy</p>
        </header>

        <div style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
            <span>🚀</span>
            <span>New Feature: Live Task Sync & Verified Quality Gates Enabled</span>
        </div>

        <div class="card">
            <div class="status-badge">
                <div class="status-dot"></div>
                System Operational & Fully Verified
            </div>

            <div class="todo-input-group">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addBtn">Add Task</button>
            </div>

            <ul id="taskList">
                <li><span>Welcome to Proj1! Ready for your tasks.</span> <button class="delete-btn" onclick="this.parentElement.remove()">Delete</button></li>
            </ul>
        </div>

        <footer>
            &copy; 2026 Proj1 Team. All rights reserved.
        </footer>
    </div>

    <script>
        const input = document.getElementById('taskInput');
        const btn = document.getElementById('addBtn');
        const list = document.getElementById('taskList');

        function addTask() {
            const val = input.value.trim();
            if(!val) return;
            const li = document.createElement('li');
            li.innerHTML = `<span>${val}</span> <button class="delete-btn" onclick="this.parentElement.remove()">Delete</button>`;
            list.appendChild(li);
            input.value = '';
        }

        btn.addEventListener('click', addTask);
        input.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') addTask();
        });
    </script>
</body>
</html>
