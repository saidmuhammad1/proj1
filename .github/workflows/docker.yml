name: Build, Publish and Deploy

on:
  pull_request:
    branches:
      - main
      - prod
  push:
    branches:
      - main
      - prod

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t proj1:test .

      - name: Smoke test
        run: |
          docker run -d --name proj1-test -p 3000:3000 proj1:test
          sleep 3
          curl --fail http://localhost:3000/
          docker rm -f proj1-test

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          else
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/saidmuhammad1/proj1:${{ steps.env.outputs.environment }}
            ghcr.io/saidmuhammad1/proj1:${{ steps.env.outputs.environment }}-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              CONTAINER="proj1-dev"
              PORT="3100"
              ENVIRONMENT="development"
              IMAGE_TAG="dev"
            else
              CONTAINER="proj1-prod"
              PORT="3200"
              ENVIRONMENT="production"
              IMAGE_TAG="prod"
            fi

            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin <<DOCKER_PASSWORD
            ${{ secrets.GITHUB_TOKEN }}
            DOCKER_PASSWORD

            docker pull "ghcr.io/saidmuhammad1/proj1:${IMAGE_TAG}"

            docker rm -f "$CONTAINER" 2>/dev/null || true

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p "${PORT}:3000" \
              -e "APP_ENV=${ENVIRONMENT}" \
              "ghcr.io/saidmuhammad1/proj1:${IMAGE_TAG}"

            docker image prune -f
