name: Build and Publish

on:
  pull_request:
    branches:
      - main
      - prod
  push:
    branches:
      - main
      - prod

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t proj1:test .

      - name: Smoke test
        run: |
          docker run -d --name proj1-test -p 3000:3000 proj1:test
          sleep 3
          curl --fail http://localhost:3000/
          docker rm -f proj1-test

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          else
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/saidmuhammad1/proj1:${{ steps.tag.outputs.environment }}
            ghcr.io/saidmuhammad1/proj1:${{ steps.tag.outputs.environment }}-${{ github.sha }}
